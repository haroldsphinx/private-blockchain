name: Release Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag or ref to benchmark against the latest main baseline"
        required: true
        type: string

env:
  BENCHMARK_RPC_URL: "http://52.44.40.113:8545"
  BENCHMARK_CL_URL: "http://54.175.18.52:5052"
  BENCHMARK_SSH_HOST: "52.44.40.113"
  BENCHMARK_TARGET_NODE_LABEL: "node-3"
  BENCHMARK_RATES: "25 100 250"
  BENCHMARK_DURATION: "30"
  BENCHMARK_POLL_INTERVAL: "5"
  BENCHMARK_STALL_THRESHOLD: "60"

jobs:
  baseline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Configure SSH Access For Node Metrics
        env:
          BENCHMARK_SSH_PRIVATE_KEY: ${{ secrets.BENCHMARK_SSH_PRIVATE_KEY }}
        run: |
          test -n "$BENCHMARK_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$BENCHMARK_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host 52.44.40.113
            User ubuntu
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh-keyscan -H 52.44.40.113 >> "$HOME/.ssh/known_hosts"

      - name: Install Flood
        run: pip install paradigm-flood

      - name: Install Vegeta
        run: go install github.com/tsenart/vegeta@v12.7.0

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run Main Baseline Benchmark
        run: ./scripts/benchmark/run.sh current

      - name: Resolve Baseline Run Directory
        id: baseline_run
        run: echo "dir=$(find results/current -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Generate Baseline Report
        run: ./scripts/benchmark/report.sh "${{ steps.baseline_run.outputs.dir }}"

      - name: Export Baseline Summary For Benchmark Action
        run: |
          mkdir -p .benchmark-action
          python3 scripts/report/export_github_action_benchmark.py \
            --run "${{ steps.baseline_run.outputs.dir }}" \
            --output-dir .benchmark-action

      - name: Download Existing Benchmark History
        id: history_download
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: benchmark.yml
          branch: main
          name: benchmark-history
          path: .benchmark-history
          if_no_artifact_found: warn

      - name: Initialize Benchmark History Files
        run: |
          mkdir -p .benchmark-history
          [ -f .benchmark-history/smaller.json ] || printf '[]\n' > .benchmark-history/smaller.json
          [ -f .benchmark-history/bigger.json ] || printf '[]\n' > .benchmark-history/bigger.json

      - name: Publish Smaller-Is-Better Baseline Summary
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: RPC Benchmark Baseline
          tool: customSmallerIsBetter
          output-file-path: .benchmark-action/github-action-benchmark-smaller.json
          external-data-json-path: .benchmark-history/smaller.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true

      - name: Publish Bigger-Is-Better Baseline Summary
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: RPC Benchmark Baseline
          tool: customBiggerIsBetter
          output-file-path: .benchmark-action/github-action-benchmark-bigger.json
          external-data-json-path: .benchmark-history/bigger.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true

      - name: Upload Latest Baseline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: |
            results/current
            reports/baseline-*

      - name: Upload Benchmark History Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: .benchmark-history

  compare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Requested Ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Configure SSH Access For Node Metrics
        env:
          BENCHMARK_SSH_PRIVATE_KEY: ${{ secrets.BENCHMARK_SSH_PRIVATE_KEY }}
        run: |
          test -n "$BENCHMARK_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$BENCHMARK_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host 52.44.40.113
            User ubuntu
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh-keyscan -H 52.44.40.113 >> "$HOME/.ssh/known_hosts"

      - name: Install Flood
        run: pip install paradigm-flood

      - name: Install Vegeta
        run: go install github.com/tsenart/vegeta@v12.7.0

      - name: Add Go Bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Download Latest Main Baseline
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: benchmark.yml
          branch: main
          name: benchmark-baseline
          path: .baseline
          if_no_artifact_found: fail

      - name: Resolve Downloaded Baseline Run Directory
        id: baseline_run
        run: echo "dir=$(find .baseline/results/current -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Run Candidate Benchmark Against Same Workload
        run: ./scripts/benchmark/run.sh candidate "${{ steps.baseline_run.outputs.dir }}"

      - name: Resolve Candidate Run Directory
        id: candidate_run
        run: echo "dir=$(find results/candidate -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Compare Baseline To Candidate
        run: ./scripts/benchmark/compare.sh "${{ steps.baseline_run.outputs.dir }}" "${{ steps.candidate_run.outputs.dir }}"

      - name: Export Candidate Summary For Benchmark Action
        run: |
          mkdir -p .benchmark-action
          python3 scripts/report/export_github_action_benchmark.py \
            --run "${{ steps.candidate_run.outputs.dir }}" \
            --output-dir .benchmark-action

      - name: Download Benchmark History
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: benchmark.yml
          branch: main
          name: benchmark-history
          path: .benchmark-history
          if_no_artifact_found: fail

      - name: Publish Smaller-Is-Better Comparison Summary
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: RPC Benchmark Comparison
          tool: customSmallerIsBetter
          output-file-path: .benchmark-action/github-action-benchmark-smaller.json
          external-data-json-path: .benchmark-history/smaller.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          save-data-file: false

      - name: Publish Bigger-Is-Better Comparison Summary
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: RPC Benchmark Comparison
          tool: customBiggerIsBetter
          output-file-path: .benchmark-action/github-action-benchmark-bigger.json
          external-data-json-path: .benchmark-history/bigger.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          save-data-file: false

      - name: Append Full Comparison Report To Job Summary
        run: |
          latest_report="$(find reports -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)/report.md"
          cat "$latest_report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Comparison Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison-${{ inputs.tag }}
          path: |
            .baseline/results/current
            results/candidate
            reports
